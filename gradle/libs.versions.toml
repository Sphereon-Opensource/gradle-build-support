[versions]
kotlin = "2.4.20"
nexus-publish = "2.0.0"
dependency-analysis = "3.18.0"
agp = "9.2.1"
# Same version as gradle-plugin-bom pins for org.cyclonedx:cyclonedx-gradle-plugin.
cyclonedx = "3.5.1"

[libraries]
nexus-publish = { module = "io.github.gradle-nexus.publish-plugin:io.github.gradle-nexus.publish-plugin.gradle.plugin", version.ref = "nexus-publish" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
dependency-analysis-gradlePlugin = { module = "com.autonomousapps.dependency-analysis:com.autonomousapps.dependency-analysis.gradle.plugin", version.ref = "dependency-analysis" }
cyclonedx-gradlePlugin = { module = "org.cyclonedx:cyclonedx-gradle-plugin", version.ref = "cyclonedx" }
android-gradleApi ={ module = "com.android.tools.build:gradle-api", version.ref = "agp" }

[bundles]

[plugins]
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.31.0" }
