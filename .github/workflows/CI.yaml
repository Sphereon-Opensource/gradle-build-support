on:
  push:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Root publish does not publish plugins included through pluginManagement.
      # Product BOM generation needs this implementation and plugin marker in Maven.
      - name: Build and publish catalog plugin
        run: |
          ./gradlew -p plugins/toml-catalog build
          ./gradlew -p plugins/toml-catalog publish
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Verify OpenAPI archive compatibility freshly
        run: ./gradlew :plugins:conventions:test --tests '*OpenApiResolverArchiveTest' --rerun
      - name: Build and publish
        run: ./gradlew build publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Archive JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbs-junit-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn
